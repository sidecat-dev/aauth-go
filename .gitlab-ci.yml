image: golang:1.25

variables:
  GOTOOLCHAIN: local

stages:
  - verify

format:
  stage: verify
  script:
    - unformatted="$(find . -type f -name '*.go' -not -path './vendor/*' -print0 | xargs -0 gofmt -l)"
    - test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
    - git diff --check

test:
  stage: verify
  script:
    - go test ./... -count=1
    - cd walkthrough/local && go test ./... -count=1
    - cd ../../walkthrough/hosted && go test ./... -count=1
    - cd ../interop && go test ./... -count=1

race:
  stage: verify
  script:
    - go test -race ./... -count=1
    - cd walkthrough/local && go test -race ./... -count=1
    - cd ../../walkthrough/hosted && go test -race ./... -count=1
    - cd ../interop && go test -race ./... -count=1

vet:
  stage: verify
  script:
    - go vet ./...
    - cd walkthrough/local && go vet ./...
    - cd ../../walkthrough/hosted && go vet ./...
    - cd ../interop && go vet ./...

build:
  stage: verify
  script:
    - go build ./...
    - cd walkthrough/local && go build ./...
    - cd ../../walkthrough/hosted && go build ./...
    - cd ../interop && go build ./...

typescript-interop:
  stage: verify
  image: node:22
  script:
    - cd walkthrough/interop/typescript-agent
    - npm ci --ignore-scripts
    - npm test
